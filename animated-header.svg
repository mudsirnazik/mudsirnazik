<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#020617"><animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="48%" stop-color="#0f766e"><animate attributeName="stop-color" values="#0f766e;#0891b2;#0f766e" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#0891b2"><animate attributeName="stop-color" values="#0891b2;#22d3ee;#0891b2" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#22d3ee" stroke-opacity=".10"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="260" rx="20" fill="url(#bg)"/>
<rect width="1200" height="260" fill="url(#grid)">
  <animateTransform attributeName="transform" type="translate" values="0 0;42 42;0 0" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- Floating programming / DevOps icons -->
<g font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#fff" filter="url(#glow)">
  <text x="70" y="75">🐍<animateTransform attributeName="transform" type="translate" values="0 0;18 -28;0 0" dur="5s" repeatCount="indefinite"/></text>
  <text x="185" y="205">☁️<animateTransform attributeName="transform" type="translate" values="0 0;-25 -35;0 0" dur="6s" repeatCount="indefinite"/></text>
  <text x="330" y="65">⚙️<animateTransform attributeName="transform" type="rotate" values="0 342 58;360 342 58" dur="7s" repeatCount="indefinite"/></text>
  <text x="465" y="210">🐳<animateTransform attributeName="transform" type="translate" values="0 0;20 -30;0 0" dur="5.5s" repeatCount="indefinite"/></text>
  <text x="755" y="55">☸️<animateTransform attributeName="transform" type="rotate" values="0 767 48;-360 767 48" dur="8s" repeatCount="indefinite"/></text>
  <text x="900" y="210">💻<animateTransform attributeName="transform" type="translate" values="0 0;-20 -30;0 0" dur="6.5s" repeatCount="indefinite"/></text>
  <text x="1080" y="72">🔐<animateTransform attributeName="transform" type="translate" values="0 0;15 28;0 0" dur="5s" repeatCount="indefinite"/></text>
  <text x="1130" y="190">🚀<animateTransform attributeName="transform" type="translate" values="0 0;-35 -20;0 0" dur="7s" repeatCount="indefinite"/></text>
</g>

<!-- Moving particles -->
<g fill="#22d3ee">
  <circle cx="90" cy="130" r="3"><animate attributeName="cx" values="90;250;90" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="110" r="2"><animate attributeName="cy" values="110;190;110" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="45" r="3"><animate attributeName="cx" values="520;680;520" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="690" cy="215" r="2"><animate attributeName="cy" values="215;75;215" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="125" r="3"><animate attributeName="cx" values="850;1030;850" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="140" r="2"><animate attributeName="cy" values="140;50;140" dur="4.5s" repeatCount="indefinite"/></circle>
</g>

<!-- Moving connection lines -->
<g fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".35">
  <path d="M40 150 C250 20 400 240 600 120 S950 20 1160 150">
    <animate attributeName="stroke-dasharray" values="1 18;18 1;1 18" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M20 210 C260 80 430 250 620 135 S950 70 1180 210">
    <animate attributeName="stroke-dashoffset" values="0;-250;0" dur="7s" repeatCount="indefinite"/>
  </path>
</g>

<text x="600" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="48" font-weight="800" filter="url(#glow)">Mudsir Nazik</text>
<text x="600" y="143" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="21">DevOps • Cloud • Automation Engineer</text>
<text x="600" y="177" text-anchor="middle" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="15">
  <animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/>
  Python • Docker • Kubernetes • AWS • Azure • Terraform • CI/CD • DevSecOps
</text>
</svg>